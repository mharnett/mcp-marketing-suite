name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck setup.sh

      - name: setup.sh integration tests
        run: bash tests/test-setup.sh

      - name: Package registry health check
        run: node tests/check-packages.js

      # The README index table is generated from each server's tool list
      # (scripts/server-table.js). The first step is offline: README.md must
      # match tool-lists.json. The second reads each server's latest npm
      # release and fails when tool-lists.json is behind it.
      - name: README server table matches the tool lists
        run: node --test tests/server-table.test.js

      - name: Tool lists match each server's latest release
        run: node scripts/server-table.js check --remote
